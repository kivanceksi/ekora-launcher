name: Ekora İstemci modu

on:
  push:
    branches: [istemci-mod]
    paths: ['istemci/**', '.github/workflows/istemci.yml']
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: istemci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Derle
        run: ./gradlew build --stacktrace --no-configuration-cache
      - name: Gömülü Fabric API modüllerini doğrula
        run: |
          unzip -l build/libs/ekora-istemci-*[0-9].jar | grep "META-INF/jars/" | tee gomulu.txt
          for m in fabric-api-base fabric-lifecycle-events-v1 fabric-key-mapping-api-v1 fabric-networking-api-v1 fabric-rendering-v1; do grep -q "$m" gomulu.txt || { echo "EKSİK: $m"; exit 1; }; done
          sha256sum build/libs/*.jar
      - name: Oyun API keşfi (javap)
        run: |
          mkdir -p build/kesif
          J=""
          for f in $(find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -i minecraft); do
            if unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.class"; then J="$f"; break; fi
          done
          echo "jar: $J" | tee build/kesif/jar.txt
          [ -n "$J" ] || exit 0
          unzip -l "$J" | grep -E "net/minecraft/client/gui/screens/inventory/|net/minecraft/client/gui/screens/[A-Z][A-Za-z]*Screen.class|net/minecraft/client/gui/components/toasts/" | awk '{print $4}' > build/kesif/siniflar.txt
          for c in net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.client.gui.screens.inventory.ContainerScreen \
                   net.minecraft.client.gui.screens.inventory.ShulkerBoxScreen net.minecraft.client.gui.screens.MenuScreens net.minecraft.world.inventory.Slot \
                   net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.world.inventory.ChestMenu net.minecraft.world.inventory.MenuType \
                   net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.screens.ConfirmLinkScreen \
                   net.minecraft.util.Util net.minecraft.world.item.ItemStack net.minecraft.client.gui.Font net.minecraft.client.gui.screens.inventory.InventoryScreen \
                   net.minecraft.client.Minecraft net.minecraft.client.gui.Gui net.minecraft.client.gui.components.EditBox net.minecraft.client.player.LocalPlayer \
                   net.minecraft.client.gui.screens.inventory.tooltip.ClientTooltipComponent net.minecraft.network.chat.Component net.minecraft.world.item.component.ItemLore; do
            echo "=== $c" >> build/kesif/javap.txt
            javap -p -cp "$J" "$c" >> build/kesif/javap.txt 2>&1 || true
          done
          javap -c -p -cp "$J" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen > build/kesif/AbstractContainerScreen.c.txt 2>&1 || true
          javap -c -p -cp "$J" net.minecraft.client.gui.screens.inventory.ContainerScreen > build/kesif/ContainerScreen.c.txt 2>&1 || true
          javap -c -p -cp "$J" net.minecraft.client.gui.screens.MenuScreens > build/kesif/MenuScreens.c.txt 2>&1 || true
          wc -l build/kesif/*
      - uses: actions/upload-artifact@v4
        with:
          name: kesif
          path: istemci/build/kesif/
      - uses: actions/upload-artifact@v4
        with:
          name: ekora-istemci-jar
          path: istemci/build/libs/*.jar

  ekran-testi:
    needs: derle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: istemci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - run: chmod +x gradlew
      - name: Oyunu ekransız aç ve ekran görüntüsü al
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace --no-configuration-cache
        timeout-minutes: 25
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: |
            istemci/**/screenshots/**
            istemci/build/run/**/logs/latest.log
            istemci/run/**/logs/latest.log
          if-no-files-found: warn

  # Çıktılar (jar + ekran görüntüleri) ayrı bir dala da yazılır: geliştirme ortamı artifact deposuna erişemiyor.
  cikti-dali:
    needs: [derle, ekran-testi]
    if: ${{ !cancelled() && needs.derle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: cikti
      - name: istemci-cikti dalına yaz
        run: |
          cd cikti
          find . -type f | sort
          git init -q -b istemci-cikti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Ekora İstemci çıktıları: ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" istemci-cikti
