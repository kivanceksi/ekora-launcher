name: Ekora İstemci modu

on:
  push:
    branches: [istemci-mod]
    paths: ['istemci/**', '.github/workflows/istemci.yml']
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: istemci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Derle
        run: ./gradlew build --stacktrace --no-configuration-cache
      - name: Gömülü Fabric API modüllerini doğrula
        run: |
          unzip -l build/libs/ekora-istemci-*[0-9].jar | grep "META-INF/jars/" | tee gomulu.txt
          for m in fabric-api-base fabric-lifecycle-events-v1 fabric-key-mapping-api-v1 fabric-networking-api-v1 fabric-rendering-v1; do grep -q "$m" gomulu.txt || { echo "EKSİK: $m"; exit 1; }; done
          sha256sum build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ekora-istemci-jar
          path: istemci/build/libs/*.jar

  ekran-testi:
    needs: derle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: istemci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - run: chmod +x gradlew
      - name: Oyunu ekransız aç ve ekran görüntüsü al
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace --no-configuration-cache
        timeout-minutes: 25
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: |
            istemci/**/screenshots/**
            istemci/build/run/**/logs/latest.log
            istemci/run/**/logs/latest.log
          if-no-files-found: warn

  # Çıktılar (jar + ekran görüntüleri) ayrı bir dala da yazılır: geliştirme ortamı artifact deposuna erişemiyor.
  cikti-dali:
    needs: [derle, ekran-testi]
    if: ${{ !cancelled() && needs.derle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: cikti
      - name: istemci-cikti dalına yaz
        run: |
          cd cikti
          find . -type f | sort
          git init -q -b istemci-cikti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Ekora İstemci çıktıları: ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" istemci-cikti
