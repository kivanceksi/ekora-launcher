name: EkoraMC sunucu duman testi

on:
  push:
    branches: [sunucu-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Paper 26.3 ile çalıştır
        timeout-minutes: 45
        run: bash calistir.sh
      - name: sunucu-test-cikti dalına yaz
        if: ${{ always() }}
        run: |
          cd cikti
          git init -q -b sunucu-test-cikti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sunucu testi çıktıları: ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sunucu-test-cikti
